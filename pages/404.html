<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Error | Gellyball Arena</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <!-- Fonts & CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { neonGreen: '#39ff14', neonBlue: '#00f3ff', darkBg: '#0b0f19', darkCard: '#111827' }, fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Orbitron', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-darkBg antialiased selection:bg-red-500 selection:text-white h-screen flex flex-col justify-center items-center relative overflow-hidden">

    <!-- Decorative background elements -->
    <div class="absolute inset-0 z-0 flex items-center justify-center opacity-10">
        <h1 class="text-[30vw] font-heading font-black text-white mix-blend-overlay">404</h1>
    </div>

    <main class="relative-z max-w-2xl w-full px-4 text-center">
        <!-- SECTION 1: Error Illustration -->
        <section class="mb-8 reveal">
            <div class="w-32 h-32 mx-auto rounded-full border-4 border-red-500/30 flex items-center justify-center bg-red-500/10 shadow-[0_0_30px_rgba(239,68,68,0.3)] animate-pulse">
                <i class="fa-solid fa-triangle-exclamation text-6xl text-red-500"></i>
            </div>
        </section>

        <!-- SECTION 2: Error Message -->
        <section class="mb-10 reveal delay-100">
            <h2 class="text-4xl md:text-5xl font-heading font-bold text-white uppercase mb-4 tracking-wider">Connection <span class="text-red-500">Lost</span></h2>
            <p class="text-gray-400 text-lg">The sector you are trying to access does not exist or has been cordoned off. Please verify coordinates.</p>
        </section>

        <!-- SECTION 3: Return Home CTA -->
        <section class="mb-8 reveal delay-200">
            <a href="../index.html" class="inline-block bg-white text-black font-heading font-bold uppercase tracking-wider px-8 py-3 rounded hover:bg-gray-200 transition">Return to Base</a>
        </section>

        <!-- SECTION 4: Support Link -->
        <section class="reveal delay-300">
            <p class="text-sm text-gray-500">Think this is a system error? <a href="contact.html" class="text-gray-300 hover:text-white underline">Contact Command HQ</a>.</p>
        </section>
    </main>

    <script src="../assets/js/main.js"></script>
</body>
</html>
